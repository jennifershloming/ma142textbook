<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title desc">
  <title id="title">Sphere</title>
  <desc id="desc">A simple sphere with radius label.</desc>

  <defs>
    <style>
      .stroke { fill: none; stroke: #0f172a; stroke-width: 3; }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; }
      .text { fill: #0f172a; font-family: Georgia, serif; font-size: 18px; }
      .label { fill: #0f172a; font-family: Georgia, serif; font-size: 16px; }
      .bg { fill: #f8fafc; }
      .shade { fill: #e2e8f0; stroke: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="360" height="280" rx="16"/>

  <circle class="shade" cx="180" cy="138" r="90"/>
  <circle class="stroke" cx="180" cy="138" r="90"/>
  <ellipse class="dash" cx="180" cy="138" rx="90" ry="32"/>
  <ellipse class="dash" cx="180" cy="138" rx="32" ry="90"/>

  <line class="dash" x1="180" y1="138" x2="270" y2="138"/>
  <text class="label" x="223" y="130">r</text>

  <text class="text" x="150" y="256">Sphere</text>
</svg>

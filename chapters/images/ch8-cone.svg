<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title desc">
  <title id="title">Cone</title>
  <desc id="desc">A simple cone with radius, height, and slant height labels.</desc>

  <defs>
    <style>
      .stroke { fill: none; stroke: #0f172a; stroke-width: 3; }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; }
      .text { fill: #0f172a; font-family: Georgia, serif; font-size: 18px; }
      .label { fill: #0f172a; font-family: Georgia, serif; font-size: 16px; }
      .bg { fill: #f8fafc; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="360" height="280" rx="16"/>

  <ellipse class="stroke" cx="180" cy="214" rx="96" ry="30"/>
  <line class="stroke" x1="180" y1="44" x2="84" y2="214"/>
  <line class="stroke" x1="180" y1="44" x2="276" y2="214"/>

  <line class="dash" x1="180" y1="44" x2="180" y2="214"/>
  <line class="dash" x1="180" y1="214" x2="276" y2="214"/>
  <line class="dash" x1="180" y1="44" x2="276" y2="214"/>

  <text class="label" x="188" y="132">h</text>
  <text class="label" x="228" y="206">r</text>
  <text class="label" x="236" y="128">l</text>
  <text class="text" x="156" y="266">Cone</text>
</svg>
